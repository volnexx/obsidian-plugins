name: Run Updater 0.8.3 Patch
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/run-updater-083-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - run: python .github/scripts/patch_updater_083.py
      - run: node --check updater-plugin/main.js
      - run: |
          git config user.name 'volnexx'
          git config user.email 'forscript2575@gmail.com'
          git add updater-plugin/main.js updater-plugin/manifest.json registry.json
          git commit -m 'Release Updater Plugin 0.8.3'
          git push origin centralize-plugins

name: Fix Updater network temp

on:
  push:
    branches:
      - fix-updater-network-0.10.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-updater-network-0.10.1
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_updater_network.py
      - name: Check syntax
        run: node --check updater-plugin/main.js
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- updater-plugin/main.js updater-plugin/manifest.json registry.json
          git diff --cached --check
          git commit -m 'Fix transient GitHub failures in Updater 0.10.1'
          git push origin HEAD:fix-updater-network-0.10.1

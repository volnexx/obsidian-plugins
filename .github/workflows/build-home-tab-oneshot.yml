name: One-shot custom Home tab build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-home-tab-oneshot.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone and customize upstream Home tab
        shell: bash
        run: |
          git clone --depth 1 https://github.com/olrenso/obsidian-home-tab.git /tmp/home-tab
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('/tmp/home-tab')

          settings = root / 'src/settings.ts'
          text = settings.read_text()
          replacements = {
              'logoType: "default",': 'logoType: "none",',
              'wordmark: "Obsidian",': 'wordmark: "",',
              'showbookmarkedFiles: app.internalPlugins.getPluginById("bookmarks") ? true : false,': 'showbookmarkedFiles: true,',
              'omnisearch: false,': 'omnisearch: true,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing settings patch target: {old}')
              text = text.replace(old, new, 1)
          settings.write_text(text)

          searchbar = root / 'src/homeTabSearchbar.ts'
          text = searchbar.read_text()
          marker = '''        this.onLoad ? this.onLoad() : null;\n    }\n\n    public updateActiveSuggester'''
          replacement = '''        this.onLoad ? this.onLoad() : null;\n    }\n\n    public async openChatGPT(): Promise<void> {\n        try {\n            const leaf = this.app.workspace.getLeaf('tab');\n            await leaf.setViewState({\n                type: 'webviewer',\n                active: true,\n                state: { url: 'https://chatgpt.com' },\n            });\n            await this.app.workspace.revealLeaf(leaf);\n        } catch (error) {\n            console.error('[Home tab] Failed to open ChatGPT in Web viewer:', error);\n            new Notice('Не удалось открыть ChatGPT во встроенном Web viewer.');\n        }\n    }\n\n    public updateActiveSuggester'''
          if marker not in text:
              raise SystemExit('Missing HomeTabSearchBar insertion point')
          searchbar.write_text(text.replace(marker, replacement, 1))

          svelte = root / 'src/ui/searchBar.svelte'
          text = svelte.read_text()
          marker = '''    function handleKeydown(e: KeyboardEvent): void{\n        // If the input field is empty and a filter is active remove it'''
          replacement = '''    function handleKeydown(e: KeyboardEvent): void{\n        if(e.key === 'Enter' && inputValue.trim().toLowerCase() === 'gpt'){\n            e.preventDefault()\n            e.stopPropagation()\n            inputValue = ''\n            void HomeTabSearchBar.openChatGPT()\n            return\n        }\n\n        // If the input field is empty and a filter is active remove it'''
          if marker not in text:
              raise SystemExit('Missing searchBar keydown insertion point')
          svelte.write_text(text.replace(marker, replacement, 1))

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['version'] = '1.2.4'
          manifest['minAppVersion'] = '1.8.0'
          manifest['description'] = 'A browser-like search tab for your local files. Custom build: type gpt and press Enter to open ChatGPT in a new Web viewer tab.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['version'] = '1.2.4'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent='\t') + '\n')
          PY

      - name: Build Home tab
        working-directory: /tmp/home-tab
        run: |
          npm ci
          npm run build

      - name: Publish to centralize-plugins
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin centralize-plugins
          git checkout -B centralize-plugins origin/centralize-plugins

          mkdir -p home-tab
          cp /tmp/home-tab/main.js home-tab/main.js
          cp /tmp/home-tab/manifest.json home-tab/manifest.json
          cp /tmp/home-tab/src/styles.css home-tab/styles.css
          cp /tmp/home-tab/LICENSE home-tab/LICENSE
          cat > home-tab/README.md <<'EOF'
          # Home tab — volnexx custom build

          Based on [olrenso/obsidian-home-tab](https://github.com/olrenso/obsidian-home-tab).

          Type `gpt` in the Home tab search field and press Enter to open `https://chatgpt.com` in a new built-in Obsidian Web viewer tab.

          Default UI/search options are based on the active volnexx Home tab configuration captured on 2026-08-21. Runtime recent-file and bookmark stores are not baked into defaults.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('registry.json')
          registry = json.loads(path.read_text())
          entry = {'id': 'home-tab', 'name': 'Home tab', 'version': '1.2.4', 'path': 'home-tab'}
          plugins = registry.setdefault('plugins', [])
          plugins[:] = [p for p in plugins if p.get('id') != 'home-tab']
          plugins.append(entry)
          path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n')
          PY

          rm -f .github/workflows/build-home-tab-custom.yml
          git add -A home-tab registry.json .github/workflows/build-home-tab-custom.yml
          git commit -m 'Add custom Home tab 1.2.4 with GPT launcher'
          git push origin centralize-plugins

      - name: Remove one-shot workflow from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/workflows/build-home-tab-oneshot.yml
          git add -A .github/workflows/build-home-tab-oneshot.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-shot Home tab build workflow'
            git push origin main
          fi

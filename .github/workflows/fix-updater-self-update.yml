name: Fix Updater self-update

on:
  push:
    branches:
      - centralize-plugins
    paths:
      - .github/workflows/fix-updater-self-update.yml
      - .github/scripts/fix_updater_self_update.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins

      - name: Patch updater
        run: python .github/scripts/fix_updater_self_update.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater-plugin/main.js updater-plugin/manifest.json registry.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix Updater Plugin self-update 0.6.1"
          git push origin HEAD:centralize-plugins

name: Fix Updater 0.7.1
on:
  push:
    branches: [centralize-plugins]
    paths: ['.github/workflows/fix-updater-071.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - name: Patch updater
        shell: python
        run: |
          from pathlib import Path
          import json, re

          p = Path('updater-plugin/main.js')
          s = p.read_text(encoding='utf-8')

          # 0.7.0 accidentally closed the plugin class before this method,
          # so this.refreshPluginManifestCache was undefined at runtime.
          s = s.replace('\n}\n\n  async refreshPluginManifestCache(pluginId, manifest) {',
                        '\n\n  async refreshPluginManifestCache(pluginId, manifest) {', 1)

          # Guarantee a non-fatal wrapper. UI cache refresh must never roll back code files.
          if 'async safeRefreshPluginManifestCache(' not in s:
              marker = '  async refreshPluginManifestCache(pluginId, manifest) {'
              wrapper = '''  async safeRefreshPluginManifestCache(pluginId, manifest) {\n    try {\n      if (typeof this.refreshPluginManifestCache === "function") {\n        await this.refreshPluginManifestCache(pluginId, manifest);\n      }\n    } catch (e) {\n      console.warn("[Updater Plugin] non-fatal manifest cache refresh error:", e);\n    }\n  }\n\n'''
              if marker not in s:
                  raise SystemExit('refreshPluginManifestCache marker missing')
              s = s.replace(marker, wrapper + marker, 1)

          # Route every runtime call through the non-fatal wrapper.
          s = s.replace('await this.refreshPluginManifestCache(pluginId, remoteManifest);',
                        'await this.safeRefreshPluginManifestCache(pluginId, remoteManifest);')
          s = s.replace('await this.refreshPluginManifestCache(pluginId, local.manifest);',
                        'await this.safeRefreshPluginManifestCache(pluginId, local.manifest);')

          # Sanity checks: both methods must now be inside the exported class.
          if 'async safeRefreshPluginManifestCache(' not in s or 'async refreshPluginManifestCache(' not in s:
              raise SystemExit('cache methods missing after patch')

          p.write_text(s, encoding='utf-8')

          mp = Path('updater-plugin/manifest.json')
          m = json.loads(mp.read_text(encoding='utf-8'))
          m['version'] = '0.7.1'
          m['description'] = 'Auto-discovers all plugin folders in the central repository, with safe self-update, backup and vault rollback/redo.'
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          rp = Path('updater-plugin/README.md')
          if rp.exists():
              r = rp.read_text(encoding='utf-8')
              r = re.sub(r'# Updater Plugin [0-9.]+', '# Updater Plugin 0.7.1', r, count=1)
              r += '\n\n## 0.7.1\n\nИсправлено расположение `refreshPluginManifestCache` внутри класса. Обновление кэша Obsidian теперь нефатально и не может отменить установку файлов.\n'
              rp.write_text(r, encoding='utf-8')

          # Keep old registry compatible for users still on pre-0.7 updater.
          reg = Path('registry.json')
          if reg.exists():
              data = json.loads(reg.read_text(encoding='utf-8'))
              for item in data.get('plugins', []):
                  if item.get('id') == 'updater-plugin':
                      item['version'] = '0.7.1'
              reg.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'volnexx'
          git config user.email 'forscript2575@gmail.com'
          git rm .github/workflows/fix-updater-071.yml
          git add updater-plugin registry.json
          git commit -m 'Release Updater Plugin 0.7.1'
          git push origin centralize-plugins

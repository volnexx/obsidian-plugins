name: Build Style Settings 2.4.2
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/build-style-settings-242.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - run: python .github/scripts/build_style_settings_242.py
      - run: node --check style-settings-plugin/main.js
      - run: |
          if grep -q "require('./main-core.js')" style-settings-plugin/main.js; then
            echo 'main.js still depends on main-core.js'
            exit 1
          fi
      - run: |
          git config user.name 'volnexx'
          git config user.email 'forscript2575@gmail.com'
          git add style-settings-plugin/main.js style-settings-plugin/manifest.json
          git commit -m 'Release Style Settings 2.4.2 standalone'
          git push origin centralize-plugins

name: Temporary fetch official LiveSync

on:
  push:
    paths:
      - '.github/workflows/tmp-fetch-official-livesync.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download official Self-hosted LiveSync 1.0.14 release
        run: |
          set -euo pipefail
          mkdir -p artifact/obsidian-livesync
          curl -fL --retry 5 --retry-delay 2 -o artifact/obsidian-livesync/main.js https://github.com/vrtmrz/obsidian-livesync/releases/download/1.0.14/main.js
          curl -fL --retry 5 --retry-delay 2 -o artifact/obsidian-livesync/manifest.json https://github.com/vrtmrz/obsidian-livesync/releases/download/1.0.14/manifest.json
          curl -fL --retry 5 --retry-delay 2 -o artifact/obsidian-livesync/styles.css https://github.com/vrtmrz/obsidian-livesync/releases/download/1.0.14/styles.css
          echo 'cc9e26500ceb5de8a83ae15eeb3c36c6a31ac65f7e8112136c62e0a4cabd7425  artifact/obsidian-livesync/main.js' | sha256sum -c -
          echo 'f0b8662a78488d013b11d20303126ce19bd6f284cc62761cc8beedf5192dba1b  artifact/obsidian-livesync/manifest.json' | sha256sum -c -
          echo 'aefe545628de6c277c3cbe4c369a2c427d9e3f8f5beb68d6709d1142dbb2d1b2  artifact/obsidian-livesync/styles.css' | sha256sum -c -
      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: official-livesync-1.0.14
          path: artifact/obsidian-livesync
          if-no-files-found: error

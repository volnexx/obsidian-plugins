name: Release Updater 0.8.5
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/release-updater-085.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - run: python .github/scripts/patch_updater_085.py
      - run: node --check updater-plugin/main.js
      - run: |
          git config user.name 'volnexx'
          git config user.email 'forscript2575@gmail.com'
          git add updater-plugin/main.js updater-plugin/manifest.json registry.json
          git commit -m 'Release Updater Plugin 0.8.5'
          git push origin centralize-plugins
      - run: |
          mkdir -p package/updater-plugin
          cp updater-plugin/main.js updater-plugin/manifest.json package/updater-plugin/
          if [ -f updater-plugin/styles.css ]; then cp updater-plugin/styles.css package/updater-plugin/; fi
          cd package
          zip -r ../updater-plugin-0.8.5.zip updater-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: updater-plugin-0.8.5
          path: updater-plugin-0.8.5.zip

name: Sync legacy plugins into monorepo

on:
  push:
    branches:
      - centralize-plugins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central branch
        uses: actions/checkout@v4
        with:
          ref: centralize-plugins

      - name: Copy plugin runtime files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p experience priority-recall resource-monitor

          for file in main.js manifest.json styles.css; do
            curl -fsSL "https://raw.githubusercontent.com/volnexx/experience/main/${file}" -o "experience/${file}"
            curl -fsSL "https://raw.githubusercontent.com/volnexx/Priority-Recall/main/${file}" -o "priority-recall/${file}"
            curl -fsSL "https://raw.githubusercontent.com/volnexx/Resource-Monitor/main/${file}" -o "resource-monitor/${file}"
          done

          cat > registry.json <<'JSON'
          {
            "schemaVersion": 1,
            "plugins": [
              {
                "id": "experience",
                "name": "Опыт",
                "version": "0.3.0",
                "path": "experience"
              },
              {
                "id": "term-interval-review",
                "name": "Повторение терминов",
                "version": "0.16.0",
                "path": "priority-recall"
              },
              {
                "id": "memory-monitor-ru",
                "name": "Монитор ресурсов",
                "version": "1.1.0",
                "path": "resource-monitor"
              }
            ]
          }
          JSON

      - name: Commit migrated plugin files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- registry.json experience/main.js experience/manifest.json experience/styles.css priority-recall/main.js priority-recall/manifest.json priority-recall/styles.css resource-monitor/main.js resource-monitor/manifest.json resource-monitor/styles.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Migrate plugin runtime files into monorepo"
          git push origin HEAD:centralize-plugins

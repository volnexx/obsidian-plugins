name: Release Updater 0.7.0

on:
  push:
    branches:
      - centralize-plugins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - name: Patch release
        run: python3 tools/release_updater_070.py
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater-plugin/main.js updater-plugin/manifest.json updater-plugin/README.md registry.json
          git commit -m "Release Updater Plugin 0.7.0"
          git push origin HEAD:centralize-plugins

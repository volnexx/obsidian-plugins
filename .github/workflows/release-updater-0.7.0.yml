name: Release Updater 0.7.0

on:
  push:
    branches:
      - centralize-plugins
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins

      - name: Patch Updater Plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('updater-plugin/main.js')
          s = p.read_text()

          s = s.replace('  registryPath: "registry.json",\n', '')
          s = s.replace('Репозиторий с registry.json.', 'Репозиторий, в корне которого лежат папки наших плагинов.')
          s = s.replace('Ветка реестра', 'Ветка плагинов')
          s = s.replace('Один реестр → одна резервная копия → обновление всех найденных наших плагинов.', 'Сканирование всех папок репозитория → одна резервная копия → обновление всех установленных наших плагинов.')

          start = s.find('    new Setting(containerEl)\n      .setName("Путь к реестру")')
          if start != -1:
              end = s.find('    new Setting(containerEl)', start + 10)
              if end != -1:
                  s = s[:start] + s[end:]

          raw = '''  async rawText(repo, branch, file) {
            const url = `https://raw.githubusercontent.com/${repo}/${encodeURIComponent(branch)}/${file}`;
            const r = await requestUrl({ url, method: "GET" });
            if (r.status < 200 || r.status >= 300) {
              throw new Error(`${repo}/${file}: HTTP ${r.status}`);
            }
            return r.text;
          }
          '''

          helpers = raw + '''
            async githubJson(url) {
              const r = await requestUrl({
                url,
                method: "GET",
                headers: {
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Updater-Plugin"
                }
              });
              if (r.status < 200 || r.status >= 300) {
                throw new Error(`GitHub API HTTP ${r.status}`);
              }
              return r.json;
            }

            async listRepositoryPluginFolders() {
              const started = Date.now();
              const [owner, repo] = String(this.settings.registryRepo || "").split("/");
              if (!owner || !repo) throw new Error("Центральный репозиторий должен быть owner/repository.");

              const branch = this.settings.registryBranch || "main";
              const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents?ref=${encodeURIComponent(branch)}`;
              const rootItems = await this.githubJson(url);
              if (!Array.isArray(rootItems)) throw new Error("GitHub не вернул список корня репозитория.");

              const dirs = rootItems.filter(item =>
                item?.type === "dir" &&
                item?.name &&
                item.name !== ".github" &&
                !item.name.startsWith(".")
              );

              const discovered = (await Promise.all(dirs.map(async dir => {
                const prefix = `${dir.path.replace(/\\/+$/u, "")}/`;
                try {
                  const [manifestText] = await Promise.all([
                    this.rawText(this.settings.registryRepo, branch, `${prefix}manifest.json`),
                    this.rawText(this.settings.registryRepo, branch, `${prefix}main.js`)
                  ]);
                  const manifest = JSON.parse(manifestText);
                  if (!manifest?.id || !manifest?.version) return null;
                  return {
                    id: manifest.id,
                    name: manifest.name || manifest.id,
                    version: manifest.version,
                    path: dir.path,
                    manifest
                  };
                } catch {
                  return null;
                }
              }))).filter(Boolean);

              new Notice(`Папок проверено: ${dirs.length}. Плагинов найдено: ${discovered.length}. ${((Date.now()-started)/1000).toFixed(2)} с.`);
              return discovered;
            }
          '''
          if raw not in s:
              raise SystemExit('rawText marker not found')
          s = s.replace(raw, helpers, 1)

          a = s.find('  async fetchRegistry() {')
          b = s.find('  async readInstalledPlugins()', a)
          if a == -1 or b == -1:
              raise SystemExit('fetchRegistry block not found')
          s = s[:a] + s[b:]

          a = s.find('  async resolveRegistryPlugins() {')
          b = s.find('  async checkOnly() {', a)
          if a == -1 or b == -1:
              raise SystemExit('resolve block not found')
          new_resolve = '''  async resolveRegistryPlugins() {
            const [remotePlugins, installed] = await Promise.all([
              this.listRepositoryPluginFolders(),
              this.readInstalledPlugins()
            ]);

            const all = remotePlugins.map(entry => ({
              entry,
              local: installed.get(entry.id) || null
            }));

            return {
              all,
              installed: all.filter(p => p.local)
            };
          }

          '''
          s = s[:a] + new_resolve + s[b:]

          s = s.replace('''      const plugins = await this.resolveRegistryPlugins();
                const updates = plugins.filter(p =>
                  compareVersions(p.entry.version, p.local.version) > 0
                );

                if (!updates.length) {
                  new Notice(`Наших установленных плагинов найдено: ${plugins.length}. Обновлений нет.`);
                  return;
                }''', '''      const discovered = await this.resolveRegistryPlugins();
                const plugins = discovered.installed;
                const updates = plugins.filter(p =>
                  compareVersions(p.entry.version, p.local.version) > 0
                );

                if (!updates.length) {
                  new Notice(`В репозитории: ${discovered.all.length}; установлено: ${plugins.length}; обновлений нет.`);
                  return;
                }''', 1)

          a = s.find('  sourceFor(entry) {')
          b = s.find('  async prepareUpdate(info) {', a)
          if a == -1 or b == -1:
              raise SystemExit('sourceFor block not found')
          s = s[:a] + '''  sourceFor(entry) {
            return {
              repo: this.settings.registryRepo,
              branch: this.settings.registryBranch || "main",
              prefix: entry.path ? `${entry.path.replace(/\\/+$/u, "")}/` : ""
            };
          }

          ''' + s[b:]

          safe = s.find('  async safeUpdateAll() {')
          chunk = s[safe:]
          chunk = chunk.replace('''    const plugins = await this.resolveRegistryPlugins();

              if (!plugins.length) {
                new Notice("Ни один установленный наш плагин не найден в центральном реестре.");
                return;
              }

              const updates = plugins.filter(p =>''', '''    const discovered = await this.resolveRegistryPlugins();
              const plugins = discovered.installed;

              if (!plugins.length) {
                new Notice(`В репозитории найдено: ${discovered.all.length}; локально установлено: 0.`);
                return;
              }

              const updates = plugins.filter(p =>''', 1)
          chunk = chunk.replace('new Notice(`Проверено ${plugins.length}. Обновлений нет.`);', 'new Notice(`В репозитории: ${discovered.all.length}; установлено: ${plugins.length}; обновлений нет.`);', 1)
          s = s[:safe] + chunk

          p.write_text(s)

          mp = Path('updater-plugin/manifest.json')
          m = json.loads(mp.read_text())
          m['version'] = '0.7.0'
          m['description'] = 'Auto-discovers every Obsidian plugin folder in a central GitHub repository, with backup, rollback/redo and self-update.'
          mp.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n')

          rp = Path('registry.json')
          reg = json.loads(rp.read_text())
          for item in reg.get('plugins', []):
              if item.get('id') == 'updater-plugin':
                  item['version'] = '0.7.0'
          rp.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n')

          readme = Path('updater-plugin/README.md')
          t = readme.read_text()
          t = re.sub(r'# Updater Plugin [0-9.]+', '# Updater Plugin 0.7.0', t, count=1)
          t += '''\n\n## 0.7.0\n\n- `registry.json` больше не задаёт список плагинов.\n- Updater автоматически сканирует все папки верхнего уровня центрального репозитория.\n- Папка считается плагином при наличии корректных `manifest.json` и `main.js`.\n- Новые плагины начинают проверяться автоматически после добавления папки.\n'''
          readme.write_text(t)
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater-plugin/main.js updater-plugin/manifest.json updater-plugin/README.md registry.json
          git commit -m "Release Updater Plugin 0.7.0"
          git push origin HEAD:centralize-plugins

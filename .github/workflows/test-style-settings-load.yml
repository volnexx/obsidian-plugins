name: Test Style Settings Load
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/test-style-settings-load.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - run: |
          mkdir -p node_modules/obsidian
          cat > node_modules/obsidian/index.js <<'EOF'
          class Plugin {
            constructor(app){ this.app = app; }
            async loadData(){ return {}; }
            async saveData(){}
            addSettingTab(){}
            addCommand(){}
            registerDomEvent(){}
          }
          class PluginSettingTab { constructor(app, plugin){ this.app=app; this.plugin=plugin; this.containerEl={}; } }
          class Setting {}
          class Notice { constructor(){} }
          module.exports={Plugin,PluginSettingTab,Setting,Notice};
          EOF
          node <<'EOF'
          global.document={
            hidden:false,
            createElement(){ return { id:'', textContent:'', remove(){} }; },
            head:{ appendChild(){} }
          };
          global.window={};
          global.localStorage={getItem(){return null;},setItem(){}};
          global.performance={now(){return 1000;}};
          global.requestAnimationFrame=()=>1;
          global.cancelAnimationFrame=()=>{};
          const app={
            vault:{getName(){return 'test';}},
            workspace:{onLayoutReady(cb){ /* do not start animation in load test */ }}
          };
          const PluginClass=require('./style-settings-plugin/main.js');
          if(typeof PluginClass!=='function') throw new Error('module export is not a class');
          const plugin=new PluginClass(app);
          Promise.resolve(plugin.onload()).then(()=>{
            console.log('STYLE_SETTINGS_ONLOAD_OK');
          }).catch(err=>{ console.error(err); process.exit(1); });
          EOF

name: Release Updater 0.10.0 Mobile
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/release-updater-0100-mobile.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - name: Build mobile-compatible Updater
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          encoded = Path('.github/scripts/updater_0100_main.gz.b64').read_text().strip()
          main = gzip.decompress(base64.b64decode(encoded))
          Path('updater-plugin/main.js').write_bytes(main)
          manifest = {
            'id': 'updater-plugin',
            'name': 'Updater Plugin',
            'version': '0.10.0',
            'minAppVersion': '1.5.0',
            'description': 'Обновляет плагины из общего репозитория на ПК, iPhone и Android; на мобильных устройствах работает через Vault.adapter и делает резервную копию внутри служебной папки Updater.',
            'author': 'volnexx',
            'isDesktopOnly': False,
          }
          Path('updater-plugin/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          rpath = Path('registry.json')
          if rpath.exists():
            try:
              r = json.loads(rpath.read_text(encoding='utf-8'))
              for item in r.get('plugins', []):
                if item.get('id') == 'updater-plugin':
                  item['version'] = '0.10.0'
              rpath.write_text(json.dumps(r, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
            except Exception:
              pass
          PY
      - name: Verify exact build and syntax
        run: |
          echo 'e4ac8e31263607556502efd4e1867d3e1edf02d944314206138f2336361f7ccb  updater-plugin/main.js' | sha256sum -c -
          node --check updater-plugin/main.js
          python - <<'PY'
          import json
          m=json.load(open('updater-plugin/manifest.json', encoding='utf-8'))
          assert m['version']=='0.10.0'
          assert m['isDesktopOnly'] is False
          s=open('updater-plugin/main.js',encoding='utf-8').read()
          assert 'const fs = require("fs");' not in s
          assert 'Platform.isDesktopApp' in s
          assert 'Vault.adapter' in s
          PY
      - name: Mobile onload smoke test
        run: |
          mkdir -p /tmp/mobile-smoke/node_modules/obsidian
          cat > /tmp/mobile-smoke/node_modules/obsidian/index.js <<'JS'
          class Plugin { constructor(app,manifest){this.app=app;this.manifest=manifest;} async loadData(){return {}} async saveData(){} registerEvent(x){return x} addRibbonIcon(){return {style:{},appendChild(){}}} addCommand(){} addSettingTab(){} }
          class PluginSettingTab { constructor(app,plugin){this.app=app;this.plugin=plugin;} }
          class Setting{}; class Notice{}; class FileSystemAdapter{};
          const Platform={isDesktopApp:false,isMobileApp:true,isIosApp:true,isAndroidApp:false,isLinux:false};
          const normalizePath=p=>String(p).replace(/\\/g,'/').replace(/\/{2,}/g,'/').replace(/^\.\//,'');
          const setIcon=()=>{}; const requestUrl=async()=>{throw new Error('network not expected')};
          module.exports={Plugin,PluginSettingTab,Setting,Notice,requestUrl,FileSystemAdapter,Platform,normalizePath,setIcon};
          JS
          cat > /tmp/mobile-smoke/test.js <<'JS'
          global.document={createElement(){return {style:{},setAttribute(){}}}};
          global.window={location:{reload(){}}};
          const Updater=require(process.cwd()+'/updater-plugin/main.js');
          const adapter={exists:async()=>false,mkdir:async()=>{},read:async()=>'',write:async()=>{},readBinary:async()=>new ArrayBuffer(0),writeBinary:async()=>{},stat:async()=>null,rmdir:async()=>{},remove:async()=>{},rename:async()=>{},list:async()=>({files:[],folders:[]})};
          const app={vault:{adapter,configDir:'.obsidian'},workspace:{onLayoutReady(){},on(){return{}},getLeavesOfType(){return[]}},plugins:{}};
          (async()=>{const p=new Updater(app,{id:'updater-plugin',version:'0.10.0'});await p.onload();if(p.isDesktopApp)throw new Error('mobile mode failed');console.log('MOBILE_ONLOAD_OK')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH=/tmp/mobile-smoke/node_modules node /tmp/mobile-smoke/test.js
      - name: Commit release
        run: |
          git config user.name 'volnexx'
          git config user.email 'forscript2575@gmail.com'
          git add updater-plugin/main.js updater-plugin/manifest.json registry.json
          git commit -m 'Release Updater Plugin 0.10.0 mobile support'
          git push origin centralize-plugins
      - name: Package ZIP
        run: |
          mkdir -p package/updater-plugin
          cp updater-plugin/main.js updater-plugin/manifest.json package/updater-plugin/
          if [ -f updater-plugin/styles.css ]; then cp updater-plugin/styles.css package/updater-plugin/; fi
          cd package && zip -r ../updater-plugin-0.10.0.zip updater-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: updater-plugin-0.10.0
          path: updater-plugin-0.10.0.zip

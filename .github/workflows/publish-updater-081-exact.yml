name: Publish exact Updater 0.8.1
on:
  push:
    paths: ['.github/workflows/publish-updater-081-exact.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - name: Write exact build
        shell: python
        run: |
          from pathlib import Path
          import base64,gzip,json
          payload=''
          Path('updater-plugin/main.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          m={
            'id':'updater-plugin','name':'Updater Plugin','version':'0.8.1','minAppVersion':'1.5.0',
            'description':'Auto-discovers central-repo plugins, matches renamed IDs/folders/names, migrates plugin IDs safely, with backup, rollback/redo and self-update.',
            'author':'volnexx','isDesktopOnly':True
          }
          Path('updater-plugin/manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          rp=Path('registry.json')
          if rp.exists():
            r=json.loads(rp.read_text(encoding='utf-8'))
            for x in r.get('plugins',[]):
              if x.get('id')=='updater-plugin': x['version']='0.8.1'
            rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Validate
        run: node --check updater-plugin/main.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updater-plugin/main.js updater-plugin/manifest.json registry.json
          git commit -m "Release Updater Plugin 0.8.1" || exit 0
          git push origin HEAD:centralize-plugins

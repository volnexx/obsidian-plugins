name: Package Updater 0.9.2
on:
  push:
    branches: [centralize-plugins]
    paths:
      - '.github/workflows/package-updater-092.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: centralize-plugins
      - run: node --check updater-plugin/main.js
      - run: |
          mkdir -p package/updater-plugin
          cp updater-plugin/main.js updater-plugin/manifest.json package/updater-plugin/
          if [ -f updater-plugin/styles.css ]; then cp updater-plugin/styles.css package/updater-plugin/; fi
          cd package
          zip -r updater-plugin-0.9.2.zip updater-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: updater-plugin-0.9.2
          path: package/updater-plugin-0.9.2.zip
